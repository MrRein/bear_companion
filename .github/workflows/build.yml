# Всяко качване сглобява Mecho.exe (с папката assets) в Mecho.zip.
# От основния клон се пуска и нова версия (Release). За хората версията е
# 1.0.K (K = номерът на сглобяването – 103, т.е. сглобяване 103 е 1.0.0); тагът
# остава vN (N = номерът на сглобяването), защото по него мечокът сравнява
# версиите (и старите версии също го разбират). Мечокът сам проверява и се обновява.
name: Build

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SEMVER_BASE: 103
    steps:
      - name: Version
        shell: bash
        run: echo "SEMVER=1.0.$(( ${{ github.run_number }} - SEMVER_BASE ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        run: >
          dotnet publish src/Mecho -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=0.1.${{ github.run_number }} -p:InformationalVersion=${{ env.SEMVER }} -o publish/Mecho
      # Пуска мечока в режим на самопроверка (менюто, магазина, кътчетата,
      # готвенето, гардероба). Ако нещо гърми, версия не излиза.
      - name: Self-test
        timeout-minutes: 12
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/Mecho/Mecho.exe -ArgumentList '--selftest' -Wait -PassThru
          # Самопроверката пише в отделна папка (не пипа истинския запис) – виж App.cs.
          Get-Content "$env:TEMP/MechoSelfTest/selftest.log"
          if ($p.ExitCode -ne 0) { Write-Error "Самопроверката не мина (код $($p.ExitCode))"; exit 1 }
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Mecho -DestinationPath publish/Mecho.zip
          # Отпечатък на архива: мечокът го проверява, преди да се обнови.
          (Get-FileHash publish/Mecho.zip -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline publish/Mecho.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Mecho
          path: publish/Mecho
      - name: Release
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v${{ github.run_number }}" publish/Mecho.zip publish/Mecho.zip.sha256 \
            --title "Версия ${{ env.SEMVER }}" --notes "${NOTES:-Нова версия}"
